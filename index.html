<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Journal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <h1>Food Journal</h1>

    <h2 id="currentHour"></h2>

    <div class="card">
        <input id="dish" placeholder="Dish Name">

        <input id="amount" placeholder="Amount">

        <input id="calories" type="number" placeholder="Calories">

        <button onclick="saveMeal()">Save Meal</button>
    </div>

    <h2>Today's Meals</h2>

    <div id="mealList"></div>

    <h2 id="totalCalories">Total: 0 Calories</h2>

    <script src="app.js"></script>

</body>
</html>
